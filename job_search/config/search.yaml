# Consultas usadas pelas APIs de busca agregada (Adzuna, Jooble) para a
# varredura diária. Cada item vira uma chamada de busca por palavra-chave
# ("what") + localização ("where"), sem precisar saber a empresa antes.
#
# Ajuste/adicione termos conforme o que trouxer melhores resultados —
# o ranqueamento final ainda é feito por job_search/config/keywords.yaml.

location: "Brasil"

# Se true: (1) acrescenta "remoto" em cada consulta abaixo antes de enviar
# ao Adzuna/Jooble, pra aumentar a chance de achar vagas remotas; e (2)
# depois de buscar, descarta qualquer vaga cujo título/descrição/local não
# mencione trabalho remoto. Nenhuma das duas APIs tem um filtro oficial e
# confiável de "só remoto" pro Brasil, então é uma solução por palavra-chave
# — pode deixar passar falso positivo/negativo. Ajustar remote_keywords em
# job_search/src/jobhunter/filters.py se precisar.
remote_only: true

queries:
  - what: "farmacêutica dados"
  - what: "análise de dados saúde"
  - what: "automação processos saúde"
  - what: "healthtech"
  - what: "analista de dados farmacêutica"
  - what: "n8n automação"
  - what: "automação farmacêutica"
  - what: "dados regulatório farmacêutico"

# Quantos resultados pedir por consulta, por plataforma.
results_per_query: 20
