# Consultas usadas pelas APIs de busca agregada (Adzuna, Jooble, Upwork)
# para a varredura diária. Cada item vira uma chamada de busca por
# palavra-chave ("what") + localização ("where"), sem precisar saber a
# empresa antes.
#
# Ajuste/adicione termos conforme o que trouxer melhores resultados —
# o ranqueamento final ainda é feito por job_search/config/keywords.yaml.

location: "Brasil"

# O Jooble nunca retornou nenhuma vaga em 19 dias de execução real
# (0 vagas, sem erro — ver histórico do repo). Hipótese não confirmada:
# o campo de localização pode precisar do nome em inglês. Testando
# "Brazil" aqui só pro Jooble; Adzuna continua usando `location` acima
# (o país já é fixo via country=br em sources/adzuna.py).
jooble_location: "Brazil"

# Upwork é freelance/contrato, não CLT/PJ tradicional — usa as mesmas
# consultas abaixo (location é ignorado, Upwork é global).
#
# DESATIVADO: o feed RSS público retorna 403 Forbidden em toda busca
# (confirmado em execução real no GitHub Actions em 2026-09-17/18) — o
# Upwork bloqueia acesso sem login de verdade. O código fica pronto em
# sources/upwork.py; só vale reativar com a API OAuth2 completa (exige
# app aprovado + login manual por conta, não é uma chave simples).
include_upwork: false

# Se true, descarta (depois de buscar) qualquer vaga cujo título/
# descrição/local não mencione trabalho remoto. TESTADO E DESATIVADO
# POR PADRÃO: o Adzuna costuma devolver só um trecho curto da descrição,
# não o anúncio completo — então muita vaga remota de verdade não cita
# "remoto" nesse trecho, e o filtro rígido descartava até 92 de 95 vagas
# reais, sobrando só ruído (ver job_search/src/jobhunter/filters.py).
#
# Em vez de excluir, o padrão agora é impulsionar: job_search/config/
# keywords.yaml tem a categoria work_mode, que dá pontuação extra pra
# vaga remota (e negativa pra presencial/híbrida) sem descartar nada —
# assim as remotas sobem pro topo do ranking sem sumir o resto.
#
# Importante: NÃO acrescentar "remoto" ao texto das consultas abaixo —
# isso faz o Adzuna/Jooble tratarem como termo obrigatório extra e some
# quase todo resultado (testado: caiu de 30 vagas pra 0 quando fizemos isso).

# Consultas agrupadas. Cada grupo é buscado e ranqueado separadamente no
# relatório diário (mesma pontuação de keywords.yaml nos dois), pra
# você ver tanto o nicho exato quanto o panorama mais amplo:
#
# - farma: específico pra indústria farmacêutica/healthtech. Volume real
#   de vagas no Brasil é pequeno, então é normal repetir por vários dias
#   até os anúncios saírem do ar.
# - geral: análise de dados/automação/cloud sem exigir termo de saúde —
#   bem mais volume, trazendo vagas novas com mais frequência; a pontuação
#   de keywords.yaml ainda prioriza as que também combinam com farma.
query_groups:
  farma:
    label: "Farmacêutica / Health"
    queries:
      - what: "farmacêutica dados"
      - what: "análise de dados saúde"
      - what: "automação processos saúde"
      - what: "healthtech"
      - what: "analista de dados farmacêutica"
      - what: "automação farmacêutica"
      - what: "dados regulatório farmacêutico"
      - what: "farmacovigilância"
      - what: "assuntos regulatórios farmacêutica"
      - what: "qualidade farmacêutica GMP"
      - what: "LIMS laboratório"
  geral:
    label: "Dados / Automação (geral)"
    queries:
      - what: "análise de dados"
      - what: "automação de processos"
      - what: "n8n automação"
      - what: "engenheiro de dados"
      - what: "business intelligence"
      - what: "RPA automação"
      - what: "power bi analista"
      - what: "cloud engineer"
      - what: "data analyst"
      - what: "low-code no-code automação"

# Quantos resultados pedir por consulta, por plataforma.
results_per_query: 20

# Quantas vagas mostrar no relatório, por grupo (não no total).
top_per_group: 15
