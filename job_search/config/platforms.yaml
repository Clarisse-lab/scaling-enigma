# Plataformas por empresa específica — OPCIONAL.
#
# A varredura diária por área/palavra-chave (sem precisar saber a empresa)
# usa os agregadores Adzuna e Jooble, configurados em search.yaml. Este
# arquivo só importa se você quiser mirar uma empresa específica além
# disso — preencha `companies` com o slug da empresa e o endpoint
# correspondente (ainda não validado, ver notes de cada plataforma) entra
# na varredura junto com o resto.
#
# mode:
#   api       -> coleta automatizada via endpoint público (sem login)
#   manual    -> sem automação segura; vagas entram via job_search/config/manual_jobs.yaml

- name: gupy
  mode: api
  notes: >
    Muitas empresas usam a Gupy com painel de vagas público em formato JSON
    (ex.: https://<empresa>.gupy.io ou portal.api.gupy.io). Endpoint exato
    varia por empresa e precisa ser validado individualmente.
  companies: []

- name: solides
  mode: api
  notes: >
    Página de vagas por empresa costuma ser pública; validar se há endpoint
    JSON ou se será necessário parsear HTML.
  companies: []

- name: abler
  mode: api
  notes: "Validar endpoint público por empresa."
  companies: []

- name: bairesdev
  mode: api
  notes: "Página de carreiras costuma ser pública, validar formato."
  companies: []

- name: inhire
  mode: api
  notes: "Ainda sem fonte implementada em sources/ — adicionar se for usar."
  companies: []

- name: linkedin
  mode: manual
  notes: >
    Scraping viola os Termos de Uso do LinkedIn e arrisca bloqueio de conta.
    Configure um alerta de vaga (Job Alert) por e-mail e cole os links
    relevantes em manual_jobs.yaml, ou copie o texto da vaga diretamente.

- name: glassdoor
  mode: manual
  notes: "Mesma lógica do LinkedIn: sem automação, entrada manual."
